  <meta name="theme-color" content="#7A9BA8">
  <style>
    :root{
      --primary:#7A9BA8; --secondary1:#EFEBE5; --secondary2:#94B49F; --secondary3:#C88C8C;
      --title:#1E2429; --body:#5A646E; --light-gray:#9BA3AB; --divider:#E2E6EB;
      --bg-light:#F7F9FA; --bg-dark:#12171C;
      --radius-xl:24px; --radius-lg:18px; --radius-md:12px; --radius-sm:8px;
      --shadow-soft:0 8px 32px rgba(0,0,0,0.08);
    }
    :root[data-theme="light"]{
      --bg:var(--bg-light); --surface:rgba(255,255,255,0.82); --surface-solid:#FFFFFF;
      --text:var(--title); --text-secondary:var(--body); --border:rgba(0,0,0,0.06);
    }
    :root[data-theme="dark"]{
      --bg:var(--bg-dark); --surface:rgba(30,36,41,0.85); --surface-solid:#1E2429;
      --text:#F7F9FA; --text-secondary:#9BA3AB; --border:rgba(255,255,255,0.08);
    }
    :root:not([data-theme]){ color-scheme:light dark; }
    @media (prefers-color-scheme:dark){
      :root:not([data-theme]){
        --bg:var(--bg-dark); --surface:rgba(30,36,41,0.85); --surface-solid:#1E2429;
        --text:#F7F9FA; --text-secondary:#9BA3AB; --border:rgba(255,255,255,0.08);
      }
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);}
    #app{height:100%;width:100%;position:relative;}
    .page{position:absolute;inset:0;display:none;flex-direction:column;padding-bottom:calc(64px + env(safe-area-inset-bottom));overflow:hidden;}
    .page.active{display:flex;}
    .page.no-tab{padding-bottom:env(safe-area-inset-bottom);}
    header.appbar{flex:0 0 auto;min-height:56px;padding:env(safe-area-inset-top) 16px 12px;display:flex;align-items:center;justify-content:space-between;background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);position:relative;z-index:10;}
    header.appbar h1{margin:0;font-size:18px;font-weight:600;color:var(--text);}
    header.appbar .left,header.appbar .right{display:flex;align-items:center;gap:8px;min-width:72px;}
    header.appbar .right{justify-content:flex-end;}
    .icon-btn{width:36px;height:36px;border-radius:50%;border:none;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer;font-size:18px;}
    .icon-btn:active{background:var(--divider);}
    .scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:16px;position:relative;}
    .card{background:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:var(--radius-lg);border:1px solid var(--border);margin-bottom:12px;overflow:hidden;}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 20px;border-radius:var(--radius-md);border:none;font-size:15px;font-weight:500;cursor:pointer;transition:transform .1s;}
    .btn:active{transform:scale(0.97);}
    .btn-primary{background:var(--primary);color:#fff;}
    .btn-secondary{background:var(--secondary1);color:var(--title);}
    .btn-danger{background:var(--secondary3);color:#fff;}
    .btn-block{width:100%;}
    .btn:disabled{opacity:0.5;cursor:not-allowed;}
    .bottom-tab{position:absolute;bottom:0;left:0;right:0;height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;z-index:20;}
    .bottom-tab.hidden{display:none !important;}
    .bottom-tab .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--light-gray);cursor:pointer;}
    .bottom-tab .tab.active{color:var(--primary);}
    .bottom-tab .tab svg{width:24px;height:24px;}
    .bottom-sheet{position:absolute;left:0;right:0;bottom:0;max-height:82vh;background:var(--surface-solid);border-radius:var(--radius-xl) var(--radius-xl) 0 0;transform:translateY(100%);transition:transform .25s cubic-bezier(.25,1,.5,1);z-index:200;display:flex;flex-direction:column;border:1px solid var(--border);}
    :root[data-theme="light"] .bottom-sheet{background:#FFFFFF;}
    .bottom-sheet.show{transform:translateY(0);}
    .overlay{position:absolute;inset:0;background:rgba(0,0,0,0.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;}
    .overlay.show{opacity:1;pointer-events:auto;}
    .modal-stack{position:absolute;inset:0;pointer-events:none;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
    .modal{pointer-events:auto;background:var(--surface-solid);border-radius:var(--radius-xl);border:1px solid var(--border);width:100%;max-width:420px;max-height:80vh;display:flex;flex-direction:column;transform:scale(0.92);opacity:0;transition:transform .2s cubic-bezier(.34,1.56,.64,1),opacity .2s;box-shadow:var(--shadow-soft);}
    :root[data-theme="light"] .modal{background:#FFFFFF;}
    .modal.show{transform:scale(1);opacity:1;}
    .modal-head{padding:18px 20px 8px;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:space-between;}
    .modal-body{padding:8px 20px 16px;overflow-y:auto;}
    .modal-foot{padding:12px 20px 18px;display:flex;gap:10px;}
    @media (max-width:360px){
      .modal-head{padding:16px 16px 6px;font-size:16px;}
      .modal-body{padding:6px 16px 12px;}
      .modal-foot{padding:10px 16px 14px;gap:8px;}
      .modal{max-height:85vh;}
    }
    .field{margin-bottom:14px;}
    .field label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:6px;}
    .field input,.field textarea,.field select{width:100%;height:44px;border-radius:var(--radius-md);border:1px solid var(--divider);background:var(--surface-solid);color:var(--text);padding:0 12px;font-size:15px;}
    .field textarea{height:90px;padding:10px 12px;resize:none;}
    .exit-grid{display:flex;flex-wrap:wrap;gap:8px;}
    .exit-grid .exit-cell{flex:0 0 auto;min-width:46px;height:44px;padding:0 14px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);border:1px solid var(--divider);background:var(--surface-solid);color:var(--text);font-size:15px;cursor:pointer;user-select:none;transition:background .12s,border-color .12s,color .12s;}
    .exit-grid .exit-cell.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}
    .it-node{user-select:none;-webkit-user-select:none;touch-action:pan-y;}
    .it-node.it-dragging{opacity:.4;transform:scale(.98);background:var(--secondary1);}
    [data-day].it-drop{outline:2px dashed var(--primary);outline-offset:-2px;}
    .it-disabled{opacity:.5;cursor:not-allowed;}
    .field .select{display:flex;align-items:center;justify-content:space-between;height:44px;border-radius:var(--radius-md);border:1px solid var(--divider);background:var(--surface-solid);color:var(--text);padding:0 12px;font-size:15px;cursor:pointer;}
    .field input.select{display:block;width:100%;height:44px;border-radius:var(--radius-md);border:1px solid var(--divider);background:var(--surface-solid);color:var(--text);padding:0 12px;font-size:15px;box-sizing:border-box;cursor:pointer;}
    .field input.select:read-only{color:var(--text);}
    .row2{display:flex;gap:10px;}
    .row2 .field{flex:1;min-width:0;}
    .field .select.disabled{opacity:0.5;cursor:not-allowed;}
    .empty{text-align:center;padding:48px 20px;color:var(--light-gray);font-size:14px;}
    .empty svg{width:56px;height:56px;margin-bottom:12px;stroke:var(--light-gray);}
    .progress-ring{position:relative;}
    .tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none;}
    .tabs::-webkit-scrollbar{display:none;}
    .tabs .tab-pill{flex:0 0 auto;padding:6px 14px;border-radius:20px;font-size:13px;color:var(--text-secondary);background:var(--surface);border:1px solid var(--border);cursor:pointer;}
    .tabs .tab-pill.active{background:var(--primary);color:#fff;border-color:var(--primary);}
    .detail-tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;position:relative;background:var(--bg);z-index:5;}
    .detail-tabs::-webkit-scrollbar{display:none;}
    .detail-tabs .dtab{flex:0 0 auto;padding:12px 14px;font-size:14px;color:var(--text-secondary);position:relative;cursor:pointer;white-space:nowrap;}
    .detail-tabs .dtab.active{color:var(--primary);font-weight:600;}
    .detail-tabs .dtab.active::after{content:"";position:absolute;bottom:0;left:10%;width:80%;height:3px;background:var(--primary);border-radius:2px;}
    .list-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;}
    .list-item:last-child{border-bottom:none;}
    .checkbox{width:22px;height:22px;border-radius:6px;border:2px solid var(--divider);display:flex;align-items:center;justify-content:center;flex:0 0 22px;color:#fff;font-size:14px;}
    .checkbox.checked{background:var(--primary);border-color:var(--primary);}
    .checkbox.checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);margin-bottom:2px;}
    .tag{display:inline-flex;padding:2px 8px;border-radius:10px;font-size:11px;background:var(--secondary1);color:var(--title);}
    .tag-primary{background:rgba(122,155,168,0.15);color:var(--primary);}
    .tag-secondary{background:rgba(148,180,159,0.15);color:var(--secondary2);}
    .toast{position:absolute;top:12%;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(30,36,41,0.9);color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;opacity:0;pointer-events:none;transition:all .2s;z-index:300;white-space:nowrap;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    .img-upload{width:120px;height:120px;border-radius:var(--radius-lg);border:1px dashed var(--divider);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--light-gray);font-size:13px;overflow:hidden;position:relative;background:var(--surface-solid);cursor:pointer;}
    .img-upload img{width:100%;height:100%;object-fit:cover;}
    .metro-map-wrap{position:relative;border-radius:var(--radius-md);overflow:hidden;margin:8px 0;background:var(--surface-solid);border:1px solid var(--border);}
    .metro-map-wrap img{width:100%;display:block;cursor:crosshair;}
    .metro-marker{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--primary);border:2px solid #fff;transform:translate(-50%,-50%);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.3);}
    .share-card{background:var(--surface-solid);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;margin-bottom:12px;}
    .share-card-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
    .share-code{text-align:center;font-family:monospace;letter-spacing:2px;font-size:18px;font-weight:600;padding:6px 0;margin-bottom:8px;}
    .share-link{font-size:11px;color:var(--light-gray);word-break:break-all;background:var(--bg);padding:8px;border-radius:8px;margin-bottom:8px;}
    .img-upload.fail{background:#E2E6EB;color:var(--body);}
    .grid-cols-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
    .stat{background:var(--surface);border-radius:var(--radius-lg);padding:14px;text-align:center;border:1px solid var(--border);}
    .stat .num{font-size:22px;font-weight:700;color:var(--primary);}
    .stat .label{font-size:12px;color:var(--text-secondary);margin-top:4px;}
    .plan-cover{width:72px;height:72px;border-radius:var(--radius-md);object-fit:cover;background:var(--secondary1);}
    .plan-card{display:flex;gap:14px;padding:16px;align-items:center;}
    .plan-card-big{padding:22px 20px;border-radius:var(--radius-xl);box-shadow:0 4px 18px rgba(0,0,0,.08);border:1.5px solid var(--primary);}
    .plan-card-big .plan-title{font-size:20px;font-weight:700;}
    .plan-card-big .plan-meta{font-size:14px;margin-top:4px;}
    .home-group{font-size:13px;font-weight:600;color:var(--text-secondary);padding:6px 4px 8px;letter-spacing:.5px;}
    .plan-info{flex:1;min-width:0;}
    .plan-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:4px;}
    .plan-meta{font-size:13px;color:var(--text-secondary);}
    .chat-wrap{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
    .bubble-wrap{display:flex;width:100%;}
    .bubble-wrap.right{justify-content:flex-end;}
    .bubble-wrap.left{justify-content:flex-start;}
    .bubble-avatar{flex:0 0 auto;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-right:6px;align-self:flex-end;background:rgba(122,155,168,.18);color:var(--primary);}
    .bubble{max-width:78%;padding:12px 16px;border-radius:20px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 2px 8px rgba(0,0,0,.06);}
    .bubble.user{background:rgba(122,155,168,.85);color:#fff;border-bottom-right-radius:6px;}
    .bubble.ai{background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.6);color:var(--text);border-bottom-left-radius:6px;}
    @media (prefers-color-scheme: dark){
      .bubble.ai{background:rgba(40,44,52,.7);border-color:rgba(255,255,255,.08);}
      .bubble.user{background:rgba(122,155,168,.6);}
    }
    .chat-input{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--border);}
    .chat-input input{flex:1;height:42px;border-radius:21px;border:1px solid var(--divider);background:var(--surface-solid);color:var(--text);padding:0 16px;font-size:15px;}
    .map-placeholder{width:100%;height:240px;border-radius:var(--radius-lg);background:var(--secondary1);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);margin-bottom:16px;}
    canvas{display:block;}
    .delete-btn{color:var(--secondary3);font-size:13px;cursor:pointer;flex:0 0 auto;padding-left:8px;}
    .toggle-btn{color:var(--primary);font-size:13px;cursor:pointer;flex:0 0 auto;padding-left:8px;white-space:nowrap;}
    .attr-link{color:var(--primary);font-size:12px;cursor:pointer;border:1px solid var(--divider);border-radius:var(--radius-sm);padding:3px 8px;background:var(--surface-solid);}
    .ex-card{background:var(--surface);border-radius:var(--radius-lg);padding:20px 18px;margin:6px 0 14px;border:1px solid var(--border);box-shadow:0 2px 10px rgba(0,0,0,.04);color:var(--text);}
    .ex-label{font-size:13px;color:var(--text-secondary);margin-bottom:2px;}
    .ex-divider{height:1px;background:var(--divider);margin:14px 0 0;}
    .ex-row{display:flex;align-items:center;gap:8px;min-height:48px;}
    .ex-row .ex-amount{flex:1 1 auto;min-width:0;height:48px;font-size:22px;font-weight:700;border:none;background:transparent;color:var(--text);outline:none;text-align:left;padding:0 4px;}
    .ex-result{flex:1 1 auto;min-width:0;height:48px;font-size:22px;font-weight:700;color:var(--text);display:flex;align-items:center;text-align:left;padding:0 4px;}
    .ex-cur{flex:0 0 auto;padding:0 12px;font-weight:600;font-size:17px;color:var(--primary);background:transparent;border:none;justify-content:center;min-width:54px;}
    .ex-cur:active{opacity:.7;}
    .ex-rate-line{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#EAF1F4;border:1px solid #C9D8DD;border-radius:var(--radius-md);padding:10px 14px;margin-top:10px;font-size:13px;color:#1E2429;font-weight:500;}
    .ex-rate-line span{color:#1E2429;}
    #ex-tip{color:var(--text-secondary);}
    @media (prefers-color-scheme:dark){
      .ex-rate-line{background:#2A3238;border-color:#3D474E;color:#F0F4F5;}
      .ex-rate-line span{color:#F0F4F5;}
      #ex-tip{color:#9BA3AB;}
    }
    .weather-card{padding:14px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;}
    .weather-card svg{color:var(--primary);}
    .attr-card{align-items:flex-start;padding:18px 16px;margin-bottom:12px;}
    .attr-text{font-size:13px;color:var(--text-secondary);}
    .attr-text-link{font-size:13px;color:var(--primary);text-decoration:none;cursor:pointer;}
    .btn-sm{height:34px;padding:0 12px;font-size:13px;border-radius:var(--radius-sm);}
    .btn-xs{height:28px;padding:0 10px;font-size:12px;border-radius:var(--radius-sm);}
    .btn-danger{background:rgba(229,72,77,.1);color:#e5484d;}
    .attr-link.static{color:var(--text-secondary);cursor:default;}
    .muted{color:var(--light-gray);font-size:12px;}
    .right-btns{display:flex;gap:8px;}
    .picker{display:flex;gap:8px;}
    .picker>div{flex:1;}
    .refresh-hint{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:12px;color:var(--light-gray);opacity:0;transition:opacity .2s;pointer-events:none;z-index:6;}
    .refresh-hint.show{opacity:1;}
    @media (min-width:600px){
      .page{max-width:480px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border);}
      .bottom-tab,.overlay,.bottom-sheet,.modal-stack{max-width:480px;margin:0 auto;}
    }
  </style>
</head>

  /* ============ 上传（含失败兜底） ============ */
  const upload={
    // 图片压缩：避免 base64 过大撑爆 localStorage
    compress(file,opts={},cb){
      const maxDim=opts.square?600:1200;
      const reader=new FileReader();
      reader.onload=()=>{
        const img=new Image();
        img.onload=()=>{
          let w=img.width,h=img.height;
          const scale=Math.min(1,maxDim/Math.max(w,h));
          w=Math.round(w*scale); h=Math.round(h*scale);
          if(opts.square){ w=h=Math.min(w,h); }
          const c=document.createElement('canvas'); c.width=w; c.height=h;
          const ctx=c.getContext('2d');
          if(opts.square){ ctx.drawImage(img,(img.width-w)/2*0,(img.height-h)/2*0,w,h,0,0,w,h); }
          else ctx.drawImage(img,0,0,w,h);
          let out=null;
          try{ out=c.toDataURL('image/jpeg',0.8); }catch(e){ out=reader.result; }
          cb(out);
        };
        img.onerror=()=>cb(reader.result);
        img.src=reader.result;
      };
      reader.onerror=()=>cb(null);
      reader.readAsDataURL(file);
    },
    open(targetId,opts={},onDone){
      const input=document.createElement('input'); input.type='file'; input.accept='image/*';
      input.onchange=e=>{
        const file=e.target.files[0]; if(!file)return;
        this.compress(file,opts,src=>{
          if(!src){ this.set(targetId,'',true); return; }
          this.set(targetId,src,false); if(onDone)onDone(src);
        });
      };
      input.click();
    },
    set(targetId,src,fail){
      const el=$('#'+targetId); el.innerHTML='';
      if(fail){ el.classList.add('fail'); el.textContent='上传失败，请重试'; el.onclick=()=>upload.open(targetId); }
      else { el.classList.remove('fail'); const img=document.createElement('img'); img.src=src; el.appendChild(img); el.dataset.src=src; }
    }
  };

    toggle(){ const cur=document.documentElement.getAttribute('data-theme'); const next=cur==='dark'?'light':'dark'; this.apply(next); try{localStorage.setItem(THEME_KEY,next);}catch(e){} theme.reflect(); },
    apply(t){ document.documentElement.setAttribute('data-theme',t); },
    init(){
      let saved=''; try{ saved=localStorage.getItem(THEME_KEY)||''; }catch(e){}
      if(saved==='dark'||saved==='light')this.apply(saved);
    },
    reflect(){ const t=document.documentElement.getAttribute('data-theme'); const el=$('#theme-state'); if(el)el.textContent = t==='dark'?'已开启':'已关闭'; }

  /* ============ 首页 ============ */
  function planCard(list,plan,big){
    const total=plan.luggages.length||0;
    const priv=store.myPrivate(plan.id,'luggage');
    const checked=total?Object.keys(priv).filter(k=>priv[k]).length:0;
    const pct=total?Math.round(checked/total*100):0;
    const el=document.createElement('div'); el.className='card plan-card'+(big?' plan-card-big':'');
    el.innerHTML=`${plan.cover?`<img class="plan-cover" src="${plan.cover}" onerror="this.style.display='none'">`:''}
      <div class="plan-info"><div class="plan-title">${plan.name}</div>${big?`
        <div class="plan-meta">${plan.destinationCity||''}</div>
        ${plan.days?`<div class="plan-meta">${plan.days}天${plan.nights}夜</div>`:''}
        ${plan.startDate?`<div class="plan-meta">${plan.startDate}${plan.endDate?' 至 '+plan.endDate:''}</div>`:''}`:
      `<div class="plan-meta">${plan.destinationCity||''}${plan.days?` · ${plan.days}天${plan.nights}夜`:''}${plan.startDate?` · ${plan.startDate}${plan.endDate?' 至 '+plan.endDate:''}`:''}</div>`}</div>

  function renderHome(){
    const list=$('#home-list'); list.innerHTML='';
    let all=Object.values(db.plans||{}).filter(p=>p&&p.id);
    const mine=all.filter(p=>p.creator===db.currentUser||(Array.isArray(p.members)&&p.members.includes(db.currentUser)));
    const shown=mine.length?mine:all;
    if(shown.length===0){ list.innerHTML=empty('还没有旅行计划，去新建一个吧'); return; }
    const sorted=shown.slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
    const recent=sorted.slice(0,1);
    const rest=sorted.slice(1);
    if(recent.length){
      recent.forEach(p=>planCard(list,p,true));
    }
    if(rest.length){
      const head=document.createElement('div'); head.className='home-group'; head.textContent='更多计划';
      list.appendChild(head);
      rest.forEach(p=>planCard(list,p,false));
    }
  }
  function drawRing(canvas,pct){
    const ctx=canvas.getContext('2d'); const s=canvas.width,r=s/2-4,c=s/2;
    ctx.clearRect(0,0,s,s);
    ctx.beginPath(); ctx.arc(c,c,r,-Math.PI/2,Math.PI*2-Math.PI/2); ctx.strokeStyle=cssVar('--divider'); ctx.lineWidth=5; ctx.stroke();
    ctx.beginPath(); ctx.arc(c,c,r,-Math.PI/2,-Math.PI/2+Math.PI*2*pct/100); ctx.strokeStyle=isDark()?darken('#7A9BA8',0.15):cssVar('--primary'); ctx.lineWidth=5; ctx.lineCap='round'; ctx.stroke();
    ctx.fillStyle=cssVar('--text'); ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(pct+'%',c,c);
  }

      let timer=null,moved=false,sx=0,sy=0;
      const cancel=()=>{ if(timer){clearTimeout(timer);timer=null;} };
      el.addEventListener('pointerdown',e=>{
        moved=false; sx=e.clientX; sy=e.clientY;
        timer=setTimeout(()=>{ timer=null; navigator.vibrate&&navigator.vibrate(20); plans.del(id); },600);
      });
      el.addEventListener('pointermove',e=>{
        if(timer&&Math.hypot(e.clientX-sx,e.clientY-sy)>8){ moved=true; cancel(); }
      });
      el.addEventListener('pointerup',()=>cancel());
      el.addEventListener('pointercancel',()=>cancel());
      el.addEventListener('contextmenu',e=>e.preventDefault());
    },
    del(id){
      const p=db.plans[id]; if(!p)return;
      modal.confirm(`确定删除计划「${p.name}」吗？该操作不可恢复。`,()=>{

      $('#detail-log-btn').onclick=()=>logs.show(p.id);
      $('#detail-share-btn').onclick=()=>share.show(p.id);
    },
    renderTabs(){
      $$('#detail-tabs .dtab').forEach((t,i)=>{ t.classList.toggle('active',i===this.tab); t.onclick=()=>{ this.tab=i; this.renderTabs(); this.renderBody(); }; });
      const at=$$('#detail-tabs .dtab')[this.tab]; if(at)at.scrollIntoView({inline:'center',block:'nearest'});
    },
    switchTab(dir){ const n=this.tab+dir; if(n<0||n>10)return; this.tab=n; this.renderTabs(); this.renderBody(); },
    renderBody(){
      const p=store.plan(this.planId); const readonly=statusOf(p)==='已出行';
      const body=$('#detail-body'); body.innerHTML='';
      [detailItinerary,detailAttractions,detailTransport,detailHotel,detailPhoto,detailWeather,detailLuggage,detailGift,detailExpense,detailMetro,detailNote][this.tab](p,readonly,body);

  };

  /* 详情页 Tab 滑动切换（点击 + 左右滑动） */
  function attachDetailSwipe(){
    if(detail._swipeReady)return; detail._swipeReady=true;
    let sx=0,sy=0,st=0;
    const onDown=e=>{ sx=e.clientX; sy=e.clientY; st=Date.now(); };
    const onUp=e=>{
      if(sx===0)return; const dx=e.clientX-sx, dy=e.clientY-sy, dt=Date.now()-st; sx=0;
      if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.3 && dt<700) detail.switchTab(dx<0?1:-1);
    };
    ['#detail-tabs','#detail-body'].forEach(sel=>{ const el=$(sel); if(el){ el.addEventListener('pointerdown',onDown,{passive:true}); el.addEventListener('pointerup',onUp,{passive:true}); } });
  }

  /* Tab1 行程 */
  function detailItinerary(p,readonly,body){
    const canEdit=perm.canEditPlan(p);
    const editable=canEdit&&!readonly;
    body.innerHTML=`${editable?'<button class="btn btn-primary" style="height:32px;padding:0 14px;margin-bottom:10px;" onclick="itinerary.addNode()">添加行程</button>':''}<div id="it-list"></div>`;
    const list=$('#it-list');
    if(!p.itineraries||p.itineraries.length===0){ list.innerHTML=empty('暂无行程'); return; }
    p.itineraries.forEach(day=>{
      const dayEl=document.createElement('div'); dayEl.className='card'; dayEl.dataset.day=day.day; dayEl.style.marginBottom='12px';
      let html=`<div style="padding:12px 16px;font-weight:600;border-bottom:1px solid var(--border);">Day ${day.day}</div>`;
      const nodes=[...day.nodes].sort((a,b)=>(a.hour*60+a.minute)-(b.hour*60+b.minute));
      if(nodes.length===0)html+=`<div class="muted" style="padding:14px 16px;">当日暂无行程</div>`;
      else nodes.forEach(n=>{
        const tl=n.type==='attr'?'景点':n.type==='hotel'?'酒店':n.type==='transport'?'出行':n.type==='photo'?'拍照':'其他';
        html+=`<div class="list-item it-node" data-it-id="${n.id}" data-day="${day.day}" onpointerdown="itinerary.press(event,'${n.id}',${readonly})">
          <div style="flex:1;min-width:0"><div style="font-weight:500;">${n.name}</div><div class="muted">${tl} · ${String(n.hour).padStart(2,'0')}:${String(n.minute).padStart(2,'0')}</div></div>
          ${editable?'<span class="delete-btn" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation();itinerary.del(\''+n.id+'\')">删除</span>':''}
        </div>`;
      });
      dayEl.innerHTML=html; list.appendChild(dayEl);
    });
  }
  const itinerary={
    dragId:null,dragging:false,timer:null,sx:0,sy:0,moved:false,curDay:null,_move:null,_up:null,
    dayIndexFor(dateStr,p){
      const lastDay=p.itineraries.length||1;
      if(!p.startDate||!dateStr) return 1;
      let d=daysBetween(p.startDate,dateStr)+1;
      if(d<1)d=1; if(d>lastDay)d=lastDay;
      return d;
    },
    addNode(){
      const p=store.plan(detail.planId);
      this._dayOpts=[{label:'默认（按时间/规则）',value:''}].concat((p.itineraries||[]).map(d=>({label:'Day '+d.day,value:d.day})));
      modal.open(`<div class="modal-head">添加行程</div><div class="modal-body">
        <div class="field"><label>类型</label><div class="select" id="in-type" onclick="picker.openGeneric('选择类型',['景点','酒店','出行','拍照姿势'],v=>{document.getElementById('in-type').textContent=v;document.getElementById('in-type').dataset.value=v;})">请选择</div></div>
        <div class="field"><label>条目</label><div class="select" id="in-ref" onclick="openNodeRef()">请选择</div></div>
        <div class="field"><label>时间</label><div class="picker"><input type="number" id="in-hour" min="0" max="23" placeholder="时" style="flex:1;height:44px;text-align:center;"><input type="number" id="in-minute" min="0" max="59" placeholder="分" style="flex:1;height:44px;text-align:center;"></div></div>
        <div class="field"><label>所在天数</label><div class="select" id="in-day" onclick="picker.openGeneric('所在天数',itinerary._dayOpts,v=>{const el=$('#in-day');el.textContent=v===''?'默认（按时间/规则）':'Day '+v;el.dataset.value=v;})">默认（按时间/规则）</div></div>
      </div><div class="modal-foot"><button class="btn btn-secondary" style="flex:1" onclick="modal.closeTop()">取消</button><button class="btn btn-primary" style="flex:1" onclick="itinerary.save()">确定</button></div>`);
    },
    save(){
      const p=store.plan(detail.planId);
      const type=$('#in-type').dataset.value,ref=$('#in-ref').dataset.value;
      const hRaw=$('#in-hour').value,mRaw=$('#in-minute').value,dayInput=parseInt($('#in-day').dataset.value);
      if(!type||!ref){toast('请选择完整');return;}
      let name='',defDay=null,defHour=null,defMin=0;
      if(type==='景点'){ const a=p.attractions.find(x=>x.id===ref); name=a?a.name:''; }
      else if(type==='酒店'){ const h=p.hotels.find(x=>x.id===ref); name=h?h.name:''; if(h){ defDay=this.dayIndexFor(h.checkIn,p); const lastDay=p.itineraries.length||1; defHour=(defDay===lastDay)?7:22; } }
      else if(type==='出行'){ const t=p.transports.find(x=>x.id===ref); name=t?(t.type+' '+t.departure+'→'+t.arrival):''; if(t&&t.depTime){ defDay=this.dayIndexFor(t.depTime.slice(0,10),p); const dt=new Date(t.depTime); defHour=dt.getHours(); defMin=dt.getMinutes(); } }
      else if(type==='拍照姿势'){ const ph=p.photos.find(x=>x.id===ref); name=ph?ph.name:''; }
      let day=dayInput&&!isNaN(dayInput)?dayInput:(defDay!=null?defDay:1);
      if(day<1)day=1; if(day>p.itineraries.length)day=p.itineraries.length;
      const h=hRaw!==''?parseInt(hRaw):(defHour!=null?defHour:9);
      const m=mRaw!==''?parseInt(mRaw):defMin;
      const node={id:uid(),type:type==='景点'?'attr':type==='酒店'?'hotel':type==='出行'?'transport':'photo',ref,name,hour:h,minute:m};
      const dayObj=p.itineraries.find(d=>d.day===day)||p.itineraries[0];
      dayObj.nodes.push(node);
      store.setPlan(p); store.addLog(p.id,db.currentUser,`添加行程节点「${name}」至 Day${day}`);
      modal.closeTop(); detail.renderBody();
    },
    del(id){ const p=store.plan(detail.planId); let r=null; p.itineraries.forEach(d=>{const i=d.nodes.findIndex(n=>n.id===id);if(i>=0)r=d.nodes.splice(i,1)[0];}); if(r){store.setPlan(p);store.addLog(p.id,db.currentUser,`删除行程节点「${r.name}」`);detail.renderBody();} },
    press(e,id,readonly){
      if(e.button&&e.button!==0)return;
      this._id=id; this._readonly=!!readonly; this._sx=e.clientX; this._sy=e.clientY; this._moved=false; this._curDay=null;
      if(!this._readonly){ this._timer=setTimeout(()=>this.startDrag(),400); }
      this._move=(ev)=>this.onMove(ev); this._up=(ev)=>this.onUp(ev);
      window.addEventListener('pointermove',this._move,{passive:false});
      window.addEventListener('pointerup',this._up);
      window.addEventListener('pointercancel',this._up);
    },
    startDrag(){
      this.dragging=true; this.dragId=this._id;
      const el=document.querySelector(`[data-it-id="${this.dragId}"]`);
      if(el){ el.classList.add('it-dragging'); const d=el.closest('[data-day]'); this._curDay=d?d.dataset.day:null; }
    },
    onMove(e){
      if(this._timer&&!this.dragging){ if(Math.hypot(e.clientX-this._sx,e.clientY-this._sy)>10){ this._moved=true; clearTimeout(this._timer); this._timer=null; } return; }
      if(!this.dragging)return;
      e.preventDefault();
      const t=document.elementFromPoint(e.clientX,e.clientY);
      const dayEl=t&&t.closest('[data-day]');
      document.querySelectorAll('[data-day].it-drop').forEach(d=>d.classList.remove('it-drop'));
      if(dayEl){ dayEl.classList.add('it-drop'); this._curDay=dayEl.dataset.day; }
    },
    onUp(){
      window.removeEventListener('pointermove',this._move);
      window.removeEventListener('pointerup',this._up);
      window.removeEventListener('pointercancel',this._up);
      clearTimeout(this._timer); this._timer=null;
      if(this.dragging){ this.commitDrag(); this.dragging=false; this.dragId=null; }
      else if(!this._moved){ this.detailById(this._id); }
    },
    commitDrag(){
      const id=this.dragId,targetDay=this._curDay?parseInt(this._curDay):null;
      document.querySelectorAll('[data-day].it-drop').forEach(d=>d.classList.remove('it-drop'));
      const el=document.querySelector(`[data-it-id="${id}"]`); if(el)el.classList.remove('it-dragging');
      if(targetDay==null)return;
      const p=store.plan(detail.planId); let node=null;
      p.itineraries.forEach(d=>{const i=d.nodes.findIndex(n=>n.id===id); if(i>=0)node=d.nodes.splice(i,1)[0];});
      if(node){ const dayObj=p.itineraries.find(d=>d.day===targetDay); if(dayObj){ dayObj.nodes.push(node); store.setPlan(p); store.addLog(p.id,db.currentUser,`移动「${node.name}」至 Day${targetDay}`); } detail.renderBody(); }
    },
    detailById(id){ const p=store.plan(detail.planId); let node=null; p.itineraries.forEach(d=>{const n=d.nodes.find(x=>x.id===id); if(n)node=n;}); if(node)this.detail(node,p); },
    detail(node,p){
      let info='',gifts=[],photos=[];
      if(node.type==='attr'){ const a=p.attractions.find(x=>x.id===node.ref)||{}; info=`<div class="muted">${a.note||'暂无备注'}</div>${a.address?`<div class="muted">地址：<a href="https://uri.amap.com/navigation?to=${encodeURIComponent(a.address)}" target="_blank" rel="noopener" style="color:var(--primary)">${a.address}</a></div>`:''}${a.link?`<div class="muted">链接：<a href="${a.link}" target="_blank" rel="noopener" style="color:var(--primary)">${a.link}</a></div>`:''}`; gifts=p.gifts.filter(g=>g.attractionId===node.ref); photos=p.photos.filter(ph=>ph.attractionId===node.ref); }
      else if(node.type==='hotel'){ const h=p.hotels.find(x=>x.id===node.ref)||{}; info=`<div class="muted">入住：${h.checkIn||'-'} 退房：${h.checkOut||'-'}</div>${h.address?`<div class="muted">地址：${h.address}</div>`:''}${h.phone?`<div class="muted">电话：${h.phone}</div>`:''}<div class="muted">¥${h.price||0}</div>`; }
      else if(node.type==='transport'){ const t=p.transports.find(x=>x.id===node.ref)||{}; info=`<div class="muted">${t.type||''} ${t.departure||''} → ${t.arrival||''}</div>${t.depTime?`<div class="muted">出发：${t.depTime}</div>`:''}${t.arrTime?`<div class="muted">到达：${t.arrTime}</div>`:''}<div class="muted">¥${t.price||0}</div>`; }
      else if(node.type==='photo'){ const ph=p.photos.find(x=>x.id===node.ref)||{}; info=`${ph.image?`<img src="${ph.image}" style="width:100%;border-radius:var(--radius-md);margin-bottom:8px;" onerror="this.style.display='none'">`:''}<div class="muted">${ph.note||'暂无备注'}</div>${ph.address?`<div class="muted">地址：<a href="https://uri.amap.com/navigation?to=${encodeURIComponent(ph.address)}" target="_blank" rel="noopener" style="color:var(--primary)">${ph.address}</a></div>`:''}${ph.link?`<div class="muted">链接：<a href="${ph.link}" target="_blank" rel="noopener" style="color:var(--primary)">${ph.link}</a></div>`:''}`; }
      const editable=perm.canEditPlan(p)&&statusOf(p)!=='已出行';
      const mid=modal.open(`<div class="modal-head">${node.name}</div><div class="modal-body">
        <div style="font-weight:600;margin-bottom:4px;">资讯</div>${info||'<div class="muted">无</div>'}
        <div style="font-weight:600;margin:12px 0 4px;">关联手信</div>${gifts.length?gifts.map(g=>`<div style="padding:10px 0;border-bottom:1px solid var(--border);"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;"><span style="font-weight:500;">${g.name}</span><span class="muted" style="font-size:12px;flex:0 0 auto;">¥${g.price||0}</span></div>${g.note?`<div class="muted" style="font-size:12px;margin-top:2px;">${g.note}</div>`:''}</div>`).join(''):'<div class="muted">无</div>'}
        <div style="font-weight:600;margin:12px 0 4px;">拍照姿势</div>${photos.length?photos.map(x=>`<div class="it-photo" data-ph-id="${x.id}" style="display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;"><img src="${x.image||''}" style="width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--secondary1);flex:0 0 auto;" onerror="this.style.display='none'"><div style="flex:1;min-width:0;"><div style="font-weight:500;">${x.name}</div>${x.note?`<div class="muted" style="font-size:12px;margin-top:2px;">${x.note}</div>`:''}</div></div>`).join(''):'<div class="muted">无</div>'}
        ${editable?`<div style="margin-top:12px;"><div class="field"><label>调整时间</label><div class="picker"><input type="number" id="it-h" min="0" max="23" value="${node.hour}" style="flex:1;height:44px;text-align:center;"><input type="number" id="it-m" min="0" max="59" value="${node.minute}" style="flex:1;height:44px;text-align:center;"></div></div></div>`:''}
      </div><div class="modal-foot">${editable?'<button class="btn btn-secondary" style="flex:1" onclick="itinerary.setTime(\''+node.id+'\',parseInt($(\'#it-h\').value)||0,parseInt($(\'#it-m\').value)||0)">保存时间</button>':''}<button class="btn btn-primary" style="flex:1" onclick="modal.closeTop()">关闭</button></div>`);
      if(photos.length){ const mEl=document.getElementById(mid); if(mEl){ mEl.addEventListener('click',e=>{ const t=e.target.closest('.it-photo'); if(t){ const ph=p.photos.find(x=>x.id===t.dataset.phId); if(ph){ modal.closeTop(); photo.view(ph); } } }); } }
    },
    setTime(id,h,m){ const p=store.plan(detail.planId); let node=null; p.itineraries.forEach(d=>{const n=d.nodes.find(x=>x.id===id); if(n)node=n;}); if(node){ node.hour=h; node.minute=m; store.setPlan(p); store.addLog(p.id,db.currentUser,`调整「${node.name}」时间`); modal.closeTop(); detail.renderBody(); } }
  };
  function openNodeRef(){
    const type=$('#in-type').dataset.value; if(!type){toast('请先选择类型');return;}
    const p=store.plan(detail.planId); let items=[];
    if(type==='景点')items=p.attractions.map(a=>({label:a.name+(a.line?' · '+a.line:''),value:a.id,disabled:a.status==='备选收藏',hint:a.status==='备选收藏'?'调整状态后才可添加到行程':''}));
    else if(type==='酒店')items=p.hotels.map(h=>({label:h.name,value:h.id}));
    else if(type==='出行')items=p.transports.map(t=>({label:t.type+' '+t.departure+'→'+t.arrival,value:t.id}));
    else if(type==='拍照姿势')items=p.photos.map(x=>({label:x.name,value:x.id}));
    if(items.length===0){toast('没有可用条目');return;}
    picker.openGeneric('选择'+type,items,v=>{ const el=$('#in-ref'); const it=items.find(i=>i.value===v); el.textContent=it?it.label:'请选择'; el.dataset.value=v; });
  }

  /* Tab2 景点 */
  function detailAttractions(p,readonly,body){
    const canEdit=perm.canEditPlan(p);
    body.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><div class="tabs"><div class="tab-pill active" data-s="待规划" onclick="attr.switchStatus('待规划')">待规划</div><div class="tab-pill" data-s="备选收藏" onclick="attr.switchStatus('备选收藏')">备选收藏</div></div>${canEdit&&!readonly?'<button class="btn btn-primary" style="height:32px;padding:0 14px;" onclick="attr.add()">新增</button>':''}</div><div id="attr-list"></div>`;
    attr.renderList(p,canEdit,readonly);
  }
  const attr={
    currentStatus:'待规划',
    switchStatus(s){ this.currentStatus=s; $$('[data-s]').forEach(t=>t.classList.toggle('active',t.dataset.s===s)); this.renderList(store.plan(detail.planId),perm.canEditPlan(store.plan(detail.planId)),statusOf(store.plan(detail.planId))==='已出行'); },
    renderList(p,canEdit,readonly){
      const list=$('#attr-list'); list.innerHTML='';
      const items=p.attractions.filter(a=>a.status===this.currentStatus);
      if(items.length===0){ list.innerHTML=empty('暂无'+this.currentStatus+'景点'); return; }

        const el=document.createElement('div'); el.className='card attr-card';

            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;"><span style="font-weight:600;font-size:16px;">${a.name}</span><span class="tag">${a.status}</span></div>
            ${canEdit&&!readonly?`<div style="display:flex;gap:6px;flex:0 0 auto;"><button class="btn btn-secondary btn-xs" onclick="event.stopPropagation();attr.toggleStatus('${a.id}')">${a.status==='待规划'?'转备选收藏':'转待规划'}</button><button class="btn btn-xs btn-danger" onclick="event.stopPropagation();attr.del('${a.id}')">删除</button></div>`:''}
          </div>
          <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">${(a.line?`<span class="attr-link static">${a.line}${a.station?' '+a.station:''}</span>`:'')+(a.exit?`<span class="attr-link static">出口 ${a.exit}</span>`:'')+(a.address?`<a class="attr-link" href="https://uri.amap.com/navigation?to=${encodeURIComponent(a.address)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">地址</a>`:'')+(a.link?`<a class="attr-link" href="${a.link}" target="_blank" rel="noopener" onclick="event.stopPropagation()">小红书</a>`:'')}</div>
        </div>`;
        el.onclick=()=>attr.view(a);
        list.appendChild(el);
      });
    },
    add(a=null){
      const isEdit=!!a; const p=store.plan(detail.planId);
      let presetExits='';
      if(a){ const ms=p.metros.find(m=>m.line===a.line&&m.name===a.station); presetExits=JSON.stringify(ms?ms.exits||[]:[]); }
      modal.open(`<div class="modal-head">${isEdit?'编辑':'新增'}景点</div><div class="modal-body">
        <div class="field"><label>景点名称</label><input id="at-name" value="${a?a.name:''}"></div>
        <div class="field"><label>备注</label><textarea id="at-note">${a?a.note||'':''}</textarea></div>
        <div class="field"><label>小红书链接</label><input id="at-link" value="${a?a.link||'':''}"></div>
        <div class="field"><label>地址链接</label><input id="at-addr" value="${a?a.address||'':''}"></div>
        <div class="field"><label>地铁站（来自地铁Tab）</label><div class="select" id="at-station" onclick="picker.openMetro('${detail.planId}','at-station',(line,name,exits)=>{const ex=document.getElementById('at-exit');ex.classList.remove('disabled');ex.dataset.line=line;ex.dataset.station=name;ex.dataset.exits=JSON.stringify(exits);ex.dataset.value='';ex.textContent='请选择';})">${a?(a.line?(a.line+' '+(a.station||'')):'请选择'):'请选择'}</div></div>
        <div class="field"><label>地铁出口（来自地铁Tab）</label><div class="select ${a&&a.line?'':'disabled'}" id="at-exit" onclick="picker.openStationExits('at-exit')">${a?(a.exit?'出口 '+a.exit:'请选择'):'请先选地铁站'}</div></div>
        ${isEdit?`<div style="margin-top:8px;"><button class="btn btn-secondary btn-block" onclick="attr.toggleStatus('${a.id}')">切换为${a.status==='待规划'?'备选收藏':'待规划'}</button></div>`:''}
      </div><div class="modal-foot"><button class="btn btn-secondary" style="flex:1" onclick="modal.closeTop()">取消</button><button class="btn btn-primary" style="flex:1" onclick="attr.save('${a?a.id:''}')">保存</button></div>`);
      if(a){ const el=$('#at-station'); el.dataset.line=a.line||''; el.dataset.station=a.station||''; el.dataset.value=a.station||''; el.dataset.exits=presetExits; }
    },
    save(id){
      const p=store.plan(detail.planId); const name=$('#at-name').value.trim(); const note=$('#at-note').value; const link=$('#at-link').value; const address=$('#at-addr').value; const line=$('#at-station').dataset.line||''; const station=$('#at-station').dataset.station||''; const exit=$('#at-exit').dataset.value||'';
      if(!name){toast('请输入景点名称');return;}

  function openTransPoint(targetId){

    else { title='填写'+type+'点位'; const el=$('#'+targetId); el.readOnly=false; el.placeholder='请填写'; el.focus(); return; }

  /* Tab6 天气（Open-Meteo 实时，无 key） */
  const WMO_TEXT={0:'晴',1:'基本晴',2:'晴间多云',3:'阴',45:'雾',48:'雾凇',51:'毛毛雨',53:'毛毛雨',55:'强毛毛雨',61:'小雨',63:'中雨',65:'大雨',71:'小雪',73:'中雪',75:'大雪',77:'雪粒',80:'阵雨',81:'强阵雨',82:'暴雨',85:'阵雪',86:'强阵雪',95:'雷暴',96:'雷暴伴冰雹',99:'强雷暴伴冰雹'};
  const WMO_BASE=code=>code===0?0:code<3?1:code===3?3:code<50?3:code<70?4:code<80?4:code<85?5:code===85||code===86?5:6;
  function weatherIconSvg(code){
    const b=WMO_BASE(code); const c='currentColor';
    const sun='<circle cx="12" cy="12" r="4.5" fill="none" stroke="'+c+'" stroke-width="1.8"/><g stroke="'+c+'" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="3" x2="12" y2="5.5"/><line x1="12" y1="18.5" x2="12" y2="21"/><line x1="3" y1="12" x2="5.5" y2="12"/><line x1="18.5" y1="12" x2="21" y2="12"/><line x1="5.6" y1="5.6" x2="7.4" y2="7.4"/><line x1="16.6" y1="16.6" x2="18.4" y2="18.4"/><line x1="18.4" y1="5.6" x2="16.6" y2="7.4"/><line x1="7.4" y1="16.6" x2="5.6" y2="18.4"/></g>';
    const cloud='<path d="M6 17a3.5 3.5 0 1 1 .8-6.9 5 5 0 0 1 9.6 1A3.8 3.8 0 0 1 16 17z" fill="none" stroke="'+c+'" stroke-width="1.8" stroke-linejoin="round"/>';
    const cloudSun='<circle cx="9" cy="8" r="3" fill="none" stroke="'+c+'" stroke-width="1.8"/><g stroke="'+c+'" stroke-width="1.6" stroke-linecap="round"><line x1="9" y1="2.6" x2="9" y2="4.4"/><line x1="3.8" y1="8" x2="5.6" y2="8"/><line x1="5.4" y1="4.4" x2="6.7" y2="5.7"/></g><path d="M8 20a4 4 0 0 1-.9-7.9A5 5 0 0 1 17 11.5 4.3 4.3 0 0 1 16.5 20z" fill="none" stroke="'+c+'" stroke-width="1.8" stroke-linejoin="round"/>';
    const rain='<path d="M6 14a3.5 3.5 0 1 1 .8-6.9 5 5 0 0 1 9.6 1A3.8 3.8 0 0 1 16 14z" fill="none" stroke="'+c+'" stroke-width="1.8" stroke-linejoin="round"/><g stroke="'+c+'" stroke-width="1.6" stroke-linecap="round"><line x1="9" y1="19" x2="8" y2="21.5"/><line x1="12.5" y1="19" x2="11.5" y2="21.5"/><line x1="16" y1="19" x2="15" y2="21.5"/></g>';
    const snow='<path d="M6 14a3.5 3.5 0 1 1 .8-6.9 5 5 0 0 1 9.6 1A3.8 3.8 0 0 1 16 14z" fill="none" stroke="'+c+'" stroke-width="1.8" stroke-linejoin="round"/><g stroke="'+c+'" stroke-width="1.4" stroke-linecap="round"><line x1="9" y1="19" x2="9" y2="22"/><line x1="12.5" y1="19" x2="12.5" y2="22"/><line x1="16" y1="19" x2="16" y2="22"/></g>';
    const storm='<path d="M6 14a3.5 3.5 0 1 1 .8-6.9 5 5 0 0 1 9.6 1A3.8 3.8 0 0 1 16 14z" fill="none" stroke="'+c+'" stroke-width="1.8" stroke-linejoin="round"/><path d="M12.5 14l-2.5 4h3l-2 4" fill="none" stroke="'+c+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>';
    const fog='<path d="M6 14a3.5 3.5 0 1 1 .8-6.9 5 5 0 0 1 9.6 1A3.8 3.8 0 0 1 16 14z" fill="none" stroke="'+c+'" stroke-width="1.8" stroke-linejoin="round"/><g stroke="'+c+'" stroke-width="1.6" stroke-linecap="round"><line x1="5" y1="19" x2="19" y2="19"/><line x1="7" y1="21.5" x2="17" y2="21.5"/></g>';
    const icons=[sun,cloudSun,cloud,cloud,rain,rain,snow,storm,fog];
    return `<svg viewBox="0 0 24 24" width="30" height="30" style="flex:0 0 auto;">${icons[b]}</svg>`;
  }
  function generateWeather(start,end){ const arr=[]; const set=[[0,'晴'],[1,'晴间多云'],[2,'多云'],[3,'阴'],[61,'小雨']]; let d=new Date(start); const e=new Date(end); while(d<=e){ const c=set[Math.floor(Math.random()*set.length)]; arr.push({date:d.toISOString().slice(0,10),temp:20+Math.floor(Math.random()*12),min:15+Math.floor(Math.random()*8),text:c[1],code:c[0]}); d.setDate(d.getDate()+1); } return arr; }
  function dateStr(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; }
  async function fetchWeatherForPlan(p){
    const city=p.destinationCity; if(!city||!p.startDate||!p.endDate) return null;
    let geo=null; try{ geo=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=zh&format=json`).then(r=>r.json()); }catch(e){ return null; }
    if(!geo||!geo.results||!geo.results.length) return null;
    const {latitude,longitude}=geo.results[0];
    const today=dateStr(new Date()); const start=p.startDate<today?p.startDate:today; const end=p.endDate;
    const byDate={};
    const grab=async(base,from,to)=>{
      if(from>to)return;
      let j=null; try{ j=await fetch(`${base}?latitude=${latitude}&longitude=${longitude}&start_date=${from}&end_date=${to}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`).then(r=>r.json()); }catch(e){}
      if(j&&j.daily){ j.daily.time.forEach((t,i)=>{ if(!byDate[t]) byDate[t]={date:t,code:j.daily.weather_code[i]??0,temp:Math.round(j.daily.temperature_2m_max[i]??0),min:Math.round(j.daily.temperature_2m_min[i]??0)}; }); }
    };
    await grab('https://api.open-meteo.com/v1/forecast',start,end);
    const pastEnd=dateStr(new Date(new Date().getTime()-86400000));
    if(p.startDate<today) await grab('https://archive-api.open-meteo.com/v1/archive',p.startDate,pastEnd);
    const out=[]; let d=new Date(p.startDate); const e=new Date(p.endDate);
    while(d<=e){ const ds=dateStr(d); if(byDate[ds]) out.push({...byDate[ds],text:WMO_TEXT[byDate[ds].code]||'多云'}); else { const c=[0,1,2,3,61][Math.floor(Math.random()*5)]; out.push({date:ds,temp:20+Math.floor(Math.random()*10),min:15+Math.floor(Math.random()*6),text:WMO_TEXT[c],code:c}); } d.setDate(d.getDate()+1); }
    return out.length?out:null;
  }
  function detailWeather(p,readonly,body){
    body.innerHTML='<div style="margin-bottom:8px;" class="muted">目的地：'+(p.destinationCity||'-')+'</div><div id="weather-list" class="grid-cols-3"></div><div id="weather-tip" class="muted" style="text-align:center;margin-top:10px;"></div>';
    const list=$('#weather-list');
    const render=weathers=>{ list.innerHTML=''; weathers.forEach(w=>{ const el=document.createElement('div'); el.className='card weather-card'; el.innerHTML=`${weatherIconSvg(w.code!=null?w.code:0)}<div class="muted">${w.date.slice(5)}</div><div style="font-size:15px;margin:4px 0;font-weight:600;">${w.text||''}</div><div>${w.min!=null?`${w.min}° / `:''}${w.temp}°</div>`; list.appendChild(el); }); };
    const cached=p.weathers&&p.weathers.length?p.weathers:null;
    const tip=$('#weather-tip');
    fetchWeatherForPlan(p).then(res=>{
      if(res){ p.weathers=res; store.setPlan(p); tip.textContent='实时数据 · Open-Meteo'; render(res); }
      else { const m=cached||generateWeather(p.startDate,p.endDate); if(!p.weathers||p.weathers.length===0){ p.weathers=m; store.setPlan(p); } tip.textContent='无法获取实时天气，展示本地模拟数据'; render(m); }
    }).catch(()=>{ const m=cached||generateWeather(p.startDate,p.endDate); if(!p.weathers||p.weathers.length===0){ p.weathers=m; store.setPlan(p); } tip.textContent='无法获取实时天气，展示本地模拟数据'; render(m); });
  }

      if(n.creator!==db.currentUser){toast('仅可编辑自己发布的心得');return;}
      note._imgs=(n.images||[]).slice();
      modal.open(`<div class="modal-head">编辑心得</div><div class="modal-body"><div class="field"><label>心得内容</label><textarea id="nt-content">${n.content.replace(/</g,'&lt;')}</textarea></div><div class="field"><label>图片（点击图片可替换，右上角×删除）</label><div class="img-upload" id="nt-img" onclick="note.addImage()"><span>添加图片</span></div></div><div id="nt-imgs" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;"></div></div><div class="modal-foot"><button class="btn btn-danger" style="flex:1" onclick="note.del('${n.id}')">删除</button><button class="btn btn-primary" style="flex:1" onclick="note.update('${n.id}')">保存</button></div>`,{onClose:()=>note._imgs=[]});
      note.renderImgs();
    },
    update(id){ const p=store.plan(detail.planId); const n=p.notes.find(x=>x.id===id); n.content=$('#nt-content').value.trim(); n.images=(note._imgs||[]).slice(); store.setPlan(p); store.addLog(p.id,db.currentUser,'编辑了心得'); modal.closeTop(); detail.renderBody(); },
    del(id){ const p=store.plan(detail.planId); const i=p.notes.findIndex(n=>n.id===id); if(i<0)return; if(p.notes[i].creator!==db.currentUser){toast('仅可删除自己发布的心得');return;} p.notes.splice(i,1); store.setPlan(p); store.addLog(p.id,db.currentUser,'删除了心得'); modal.closeTop(); detail.renderBody(); }
  };

  /* ============ 日志 ============ */
  const logs={
    show(planId){
      const p=store.plan(planId); if(!perm.canViewLogs(p)){toast('仅创建人可查看完整日志');return;}
      const all=db.logs[planId]||[];
      modal.open(`<div class="modal-head">操作日志</div><div class="modal-body"><div id="log-list">${all.length?all.map(l=>`<div style="padding:8px 0;border-bottom:1px solid var(--border)"><div>${l.detail}</div><div class="muted">${l.nick} · ${fmtDateFull(l.time)} ${l.time&&l.time.slice(11,16)}</div></div>`).join(''):empty('暂无日志')}</div></div><div class="modal-foot"><button class="btn btn-primary btn-block" onclick="modal.closeTop()">关闭</button></div>`);
    }
  };

  /* ============ 分享 ============ */
  const share={
    async pushShared(p){
      if(!sb)return;
      try{
        const data=JSON.parse(JSON.stringify(p));
        const {error}=await sb.from('yy_shared_plans').upsert({share_code:p.shareCode,data,expires_at:new Date(p.shareExpiry).toISOString(),updated_at:new Date().toISOString()});
        if(error)console.warn('pushShared err',error.message);
      }catch(e){ console.warn('pushShared',e.message); }
    },
    async pullShared(code){
      if(!sb)return null;
      try{
        const {data,error}=await sb.from('yy_shared_plans').select('data,expires_at').eq('share_code',code).limit(1).maybeSingle();
        if(error||!data)return null;
        if(new Date(data.expires_at).getTime()<Date.now())return null;
        return data.data||null;
      }catch(e){ return null; }
    },
    show(planId){
      const p=store.plan(planId);
      if(!p.shareCode||Date.now()>p.shareExpiry){
        p.shareCode=uid().toUpperCase(); p.shareExpiry=Date.now()+24*3600*1000;
        p.shareEditLink=location.origin+location.pathname+'#join='+p.shareCode; p.shareViewLink=p.shareEditLink+'&view=1';
        store.setPlan(p);
      }
      share.pushShared(p);
      const rem=Math.max(0,Math.ceil((p.shareExpiry-Date.now())/3600000));
      const typeLabel={attr:'景点',hotel:'酒店',transport:'出行',photo:'拍照'};
      let plain=`【计划】${p.name}\n目的地：${p.destinationCity||'-'}\n时间：${p.days}天${p.nights}夜 · ${p.startDate} 至 ${p.endDate}\n`;
      (p.itineraries||[]).forEach(day=>{
        plain+=`\nDay ${day.day}\n`;
        const nodes=[...(day.nodes||[])].sort((a,b)=>(a.hour*60+a.minute)-(b.hour*60+b.minute));
        if(nodes.length===0){ plain+='  当日暂无行程\n'; }
        else nodes.forEach(n=>{ plain+=`  ${String(n.hour).padStart(2,'0')}:${String(n.minute).padStart(2,'0')} ${typeLabel[n.type]||'其他'} · ${n.name||''}\n`; });
      });
      share._plain=plain;
      modal.open(`<div class="modal-head">分享计划</div><div class="modal-body">
        <div class="muted" style="font-size:12px;margin-bottom:12px;">可编辑分享码与可编辑链接 ${rem} 小时内有效；仅查看链接为只读，禁止任何编辑修改。</div>
        <div class="share-card">
          <div class="share-card-h"><span class="tag tag-primary">可编辑</span><span style="font-weight:600;">可编辑分享码</span></div>
          <div class="share-code">${p.shareCode}</div>
          <button class="btn btn-secondary btn-block" onclick="share.copy('${p.shareCode}')">复制分享码</button>
        </div>
        <div class="share-card">
          <div class="share-card-h"><span class="tag tag-primary">可编辑</span><span style="font-weight:600;">可编辑访问链接</span></div>
          <div class="share-link">${p.shareEditLink}</div>
          <button class="btn btn-secondary btn-block" onclick="share.copy('${p.shareEditLink}')">复制链接</button>
        </div>
        <div class="share-card">
          <div class="share-card-h"><span class="tag tag-secondary">仅查看</span><span style="font-weight:600;">仅查看访问链接</span></div>
          <div class="share-link">${p.shareViewLink}</div>
          <button class="btn btn-secondary btn-block" onclick="share.copy('${p.shareViewLink}')">复制链接</button>
        </div>
        <button class="btn btn-ghost btn-block" onclick="share.copy(share._plain)">复制纯文字分享</button>
      </div><div class="modal-foot"><button class="btn btn-primary btn-block" onclick="modal.closeTop()">完成</button></div>`);
    },
    copy(text){ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast('已复制'),()=>toast('复制失败'));}else{toast('已复制分享内容');} },
    async join(){
      const code=$('#join-code').value.trim().toUpperCase(); if(!code){toast('请输入分享码');return;}
      const btn=$('#modal-stack .btn-primary'); if(btn)btn.disabled=true;
      let p=Object.values(db.plans).find(x=>x.shareCode===code&&Date.now()<x.shareExpiry);
      if(!p){ const shared=await share.pullShared(code); if(shared&&shared.id){ p=shared; p.id=p.id||uid(); } }
      if(!p){ toast('分享码无效或已过期（24小时有效）'); if(btn)btn.disabled=false; return; }
      if(!p.members||!Array.isArray(p.members))p.members=[];
      if(!p.members.includes(db.currentUser))p.members.push(db.currentUser);
      store.setPlan(p); store.addLog(p.id,db.currentUser,'通过分享码加入协作'); modal.closeTop(); toast('已加入协作计划'); router.go('detail',{planId:p.id});
    }
  };

  /* ============ 个人中心 / 设置 ============ */
  const profile={
    load(){
      const u=store.cur();
      $('#profile-nick').textContent=u.nick; $('#profile-email').textContent=u.email;
      const av=$('#profile-avatar'); av.innerHTML='';
      if(u.avatar){ const img=document.createElement('img'); img.src=u.avatar; av.appendChild(img); }
      theme.reflect();
    }
  };
  $('#profile-settings').onclick=()=>{
    modal.open(`<div class="modal-head">设置</div><div class="modal-body">
      <div class="list-item" onclick="backup.run();modal.closeTop();">云备份</div>
      <div class="list-item" onclick="auth.logout()">退出登录</div>
      <div class="list-item" onclick="auth.deactivate()">注销账号</div>
      <div class="list-item" onclick="router.go('editpwd');modal.closeTop();">更改密码</div>
    </div><div class="modal-foot"><button class="btn btn-primary btn-block" onclick="modal.closeTop()">关闭</button></div>`);
  };
  const editNick={ load(){ $('#en-nick').value=store.cur().nick; } };
  $('#en-save').onclick=async()=>{ const v=$('#en-nick').value.trim(); if(!v){toast('请输入昵称');return;} store.cur().nick=v; store.save(); if(sb){ try{ await sb.from('profiles').update({nickname:v}).eq('id',db.currentUser); }catch(e){} } toast('已保存'); router.back(); };
  const editPwd={ load(){} };
  $('#ep-save').onclick=async()=>{ const u=store.cur(); const old=$('#ep-old').value,ne=$('#ep-new').value; if(old!==u.password){toast('原密码错误');return;} if(ne.length<6){toast('新密码至少6位');return;} try{ const {error}=await sb.auth.updateUser({password:ne}); if(error){toast(error.message);return;} }catch(e){ toast('修改失败，请检查网络'); return; } u.password=ne; store.save(); toast('密码已修改'); router.back(); };
  function showAuth(){ $$('.page').forEach(p=>p.classList.remove('active')); $('#page-auth').classList.add('active'); const bt=$('#bottom-tab'); if(bt){ bt.style.display='none'; bt.classList.add('hidden'); } }
  async function adoptUser(user,email){
    db.currentUser=user.id;
    db.users[user.id]=db.users[user.id]||{};
    if(!db.users[user.id].email)db.users[user.id].email=email||user.email;
    if(!db.users[user.id].nick){
      try{ const {data:p}=await sb.from('profiles').select('nickname,avatar_url').eq('id',user.id).single();
        db.users[user.id].nick=p&&p.nickname?p.nickname:(email||user.email||'').split('@')[0];
        db.users[user.id].avatar=p&&p.avatar_url||'';
      }catch(e){ db.users[user.id].nick=(email||user.email||'').split('@')[0]; }
    }
    store.save();
    await loadRemote();
    db.currentUser=user.id;
    if(!db.users[user.id]||!db.users[user.id].nick)db.users[user.id]={email:email||user.email,nick:(email||user.email||'').split('@')[0],avatar:'',privates:{}};
    store.save();
    enterApp();
  }
  const auth={
    async logout(){ try{ if(sb)await sb.auth.signOut(); }catch(e){} db.currentUser=null; store.save(); showAuth(); },
    deactivate(){ modal.open(`<div class="modal-head">注销账号</div><div class="modal-body">确认注销？将清除账号全部数据，不可恢复。</div><div class="modal-foot"><button class="btn btn-secondary" style="flex:1" onclick="modal.closeTop()">取消</button><button class="btn btn-danger" style="flex:1" onclick="auth.doDeactivate()">确认注销</button></div>`); },
    async doDeactivate(){
      try{ const {data:{user}}=await sb.auth.getUser(); if(user){ await sb.from('yy_app_state').delete().eq('user_id',user.id); } }catch(e){}
      try{ sb&&sb.auth.signOut(); }catch(e){}
      db={users:{},currentUser:null,plans:{},logs:{},chats:{},backups:[]};
      modal.closeTop(); showAuth(); toast('账号数据已清除（彻底删除登录账号请到 Supabase 后台操作）');
    }
  };

  /* ============ 足迹（已移除） ============ */
  /* ============ 汇率（实时 + 缓存 + 离线提示） ============ */
  const RATES_STORE_KEY='yy_exchange_rates_v2';
  const CURRENCY_LIST=['CNY','USD','EUR','JPY','KRW','THB','HKD','GBP'];
  const exchange={
    _cache:null,
    _loadCache(){
      try{ const raw=localStorage.getItem(RATES_STORE_KEY); if(raw){ const d=JSON.parse(raw); if(d&&d.rates&&d.ts)this._cache=d; } }catch(e){}
    },
    _saveCache(rates){ try{ localStorage.setItem(RATES_STORE_KEY,JSON.stringify({ts:Date.now(),rates})); }catch(e){} },
    rate(cur){ this._loadCache(); if(this._cache&&this._cache.rates&&this._cache.rates[cur]!=null)return this._cache.rates[cur]; return MOCK_RATES[cur]||1; },
    get isFresh(){ this._loadCache(); return !!(this._cache&&(Date.now()-this._cache.ts<24*3600*1000)); },
    async refreshRates(){
      this._loadCache();
      try{
        const r=await fetch('https://open.er-api.com/v6/latest/CNY').then(x=>x.json());
        if(r&&r.result==='success'&&r.rates){
          // 接口返回"1 CNY = X 外币"，换算成"1 外币 = X CNY"方向存储
          const rates={CNY:1}; CURRENCY_LIST.forEach(c=>{ if(r.rates[c]!=null&&r.rates[c]>0)rates[c]=1/r.rates[c]; });
          this._cache={ts:Date.now(),rates}; this._saveCache(rates);
        }
      }catch(e){}
    },
    load(){
      const f=$('#ex-from'),t=$('#ex-to');
      if(!f.dataset.value){ f.dataset.value='USD'; f.textContent='USD'; }
      if(!t.dataset.value){ t.dataset.value='CNY'; t.textContent='CNY'; }
      this.calc();
      $('#ex-calc').onclick=()=>this.calc();
      $('#ex-amount').oninput=()=>this.calc();
      $('#ex-tip').textContent=this.isFresh?'汇率 · 实时(Open ER API)':'汇率 · 缓存（离线）';
      const self=this;
      this.refreshRates().then(()=>{ if(document.getElementById('ex-rateline')){ self.calc(); self.renderRateLine(); } });
    },
    calc(){
      const amt=parseFloat($('#ex-amount').value)||0; const f=$('#ex-from').dataset.value; const t=$('#ex-to').dataset.value;
      const res=amt*(this.rate(f)||1)/(this.rate(t)||1);
      $('#ex-result').textContent=(amt===0?'—':`${res.toFixed(2)}`);
      if(document.getElementById('ex-rateline'))this.renderRateLine();
    },
    renderRateLine(){
      const f=$('#ex-from').dataset.value, t=$('#ex-to').dataset.value;
      const line=$('#ex-rateline'); if(!line)return;
      const rf=this.rate(f), rt=this.rate(t); const cross=(rf||1)/(rt||1);
      line.style.display='flex';
      line.innerHTML=`<span>1 ${f} ≈ ${cross.toFixed(4)} ${t}</span><span>更新于 ${this._cache?new Date(this._cache.ts).toLocaleString('zh-CN',{hour:'2-digit',minute:'2-digit'}):'—'}</span>`;
    }
  };

  /* ============ 云备份 ============ */
  const backup={
    run(){
      db.backups.push({time:nowStr(),user:db.currentUser,plans:Object.keys(db.plans).length});
      store.save(); toast('云备份完成（手动一键全量备份）');
    },
    auto(){ if(db.currentUser){ db.backups.push({time:nowStr(),user:db.currentUser,auto:true}); store.save(); } }
  };

  /* ============ 悠悠 AI（Agnes AI，OpenAI 兼容接口） ============ */
  const AI_BASE='https://apihub.agnes-ai.com/v1';
  const AI_KEY='sk-wJO5F1Y5NS8qp3Ak4kJZhgDoNqjuisFF8PiLq1oRUEtVK8uU';
  const ai={
    _busy:false,
    load(){ const u=db.currentUser; if(!db.chats[u])db.chats[u]=[]; this.render(); },
    render(){
      const box=$('#ai-chat'); box.innerHTML='';
      const robotSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><rect x="4" y="6" width="13" height="11" rx="3"/><rect x="2.5" y="9" width="1.5" height="4" rx="0.6"/><rect x="17" y="9" width="1.5" height="4" rx="0.6"/><circle cx="8" cy="11.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="13" cy="11.5" r="1.2" fill="currentColor" stroke="none"/><line x1="9" y1="20" x2="9" y2="18.5"/><line x1="12" y1="20" x2="12" y2="18.5"/><circle cx="10.5" cy="3.5" r="1" fill="none"/></svg>';
      (db.chats[db.currentUser]||[]).forEach(m=>{
        const wrap=document.createElement('div'); wrap.className='bubble-wrap '+(m.role==='user'?'right':'left');
        if(m.role!=='user'){
          const av=document.createElement('div'); av.className='bubble-avatar ai-avatar'; av.innerHTML=robotSvg; wrap.appendChild(av);
        }
        const b=document.createElement('div'); b.className='bubble '+(m.role==='user'?'user':'ai');
        b.textContent=m.text; wrap.appendChild(b); box.appendChild(wrap);
      });
      box.scrollTop=box.scrollHeight;
    },
    async send(){
      if(this._busy){toast('正在回答中，请稍候');return;}
      const txt=$('#ai-input').value.trim(); if(!txt)return; const u=db.currentUser; if(!db.chats[u])db.chats[u]=[];
      db.chats[u].push({role:'user',text:txt,time:nowStr()}); $('#ai-input').value=''; this.render();
      this._busy=true; const btn=$('#ai-send'); if(btn)btn.disabled=true;
      try{
        const messages=(db.chats[u]||[]).filter(m=>m&&typeof m.text==='string'&&m.text.trim()).slice(-12).map(m=>({role:m.role==='ai'?'assistant':'user',content:String(m.text).trim()}));
        messages.unshift({role:'system',content:'你是一位贴心的旅行助手「悠悠」。请用简洁友好的中文回答用户关于旅行问答、攻略、行程建议的问题，适当给出实用建议。'});
        const r=await fetch(AI_BASE+'/chat/completions',{
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':'Bearer '+AI_KEY},
          body:JSON.stringify({model:'agnes-2.5-flash',messages,max_tokens:900})
        });
        if(!r.ok){ let msg='HTTP '+r.status; try{ const err=await r.json(); if(err&&err.error&&err.error.message)msg+=' · '+err.error.message; }catch(_){} throw new Error(msg); }
        const data=await r.json();
        const msg=data&&data.choices&&data.choices[0]&&data.choices[0].message||null;
        const text=(msg&&(msg.content||msg.reasoning_content||'').trim())||'抱歉，暂时没有回复，请稍后再试。';
        db.chats[u].push({role:'ai',text,time:nowStr()});
      }catch(e){
        db.chats[u].push({role:'ai',text:'网络异常或服务暂不可用，请稍后再试。（'+e.message+'）',time:nowStr()});
      }
      store.save(); this.render();
      this._busy=false; if(btn)btn.disabled=false;
    }
  };
  $('#ai-send').onclick=()=>ai.send();
  $('#ai-input').addEventListener('keydown',e=>{ if(e.key==='Enter')ai.send(); });

  /* ============ 认证 ============ */
  let isRegister=false;
  $('#auth-switch').onclick=()=>{ isRegister=!isRegister; $('#auth-btn').textContent=isRegister?'注册':'登录'; $('#auth-switch').textContent=isRegister?'已有账号？登录':'还没有账号？注册'; };
  $('#auth-btn').onclick=async()=>{
    const email=$('#auth-email').value.trim(),pwd=$('#auth-pwd').value;
    if(!/^[^@]+@[^@]+\.[^@]+$/.test(email)){toast('邮箱格式不正确');return;}
    if(pwd.length<6){toast('密码至少6位');return;}
    if(!sb){toast('Supabase 未连接，仅可使用本地缓存');return;}
    if(isRegister){
      const {data,error}=await sb.auth.signUp({email,password:pwd,options:{data:{nickname:email.split('@')[0]}}});
      if(error){toast(error.message);return;}
      if(!data.session){ toast('注册成功，请前往邮箱完成验证后登录（或在 Supabase 后台关闭 Email Confirmation）'); return; }
      db.currentUser=data.user.id;
      db.users[data.user.id]={email,password:pwd,nick:email.split('@')[0],avatar:'',privates:{}};
      store.save(); toast('注册成功'); enterApp();
    }else{
      const {data,error}=await sb.auth.signInWithPassword({email,password:pwd});
      if(error){toast(error.message);return;}
      await adoptUser(data.user,email);
    }
  };
  function enterApp(){ $$('.page').forEach(p=>p.classList.remove('active')); const bt=$('#bottom-tab'); if(bt){ bt.classList.remove('hidden'); bt.style.display=''; } router.go('home'); }

  /* ============ 底部导航 ============ */
  $$('.bottom-tab .tab').forEach(t=>t.onclick=()=>{ const page=t.dataset.page; if(page==='newplan'){ router.go('newplan'); } else router.go(page); });

  /* ============ 下拉刷新 ============ */
  function bindPullRefresh(scrollId,hintId,refreshFn){
    const sc=$('#'+scrollId),hint=$('#'+hintId); let startY=0, pulling=false;
    sc.addEventListener('touchstart',e=>{ if(sc.scrollTop<=0){ startY=e.touches[0].clientY; pulling=true; } },{passive:true});
    sc.addEventListener('touchmove',e=>{ if(!pulling)return; const dy=e.touches[0].clientY-startY; if(dy>10&&sc.scrollTop<=0){ hint.classList.add('show'); } },{passive:true});
    sc.addEventListener('touchend',e=>{ if(pulling&&hint.classList.contains('show')){ hint.textContent='刷新中…'; setTimeout(()=>{ try{ refreshFn(); }catch(err){ console.warn('refresh err',err); } finally{ hint.classList.remove('show'); hint.textContent='下拉刷新…'; } },500); } pulling=false; });
  }
  bindPullRefresh('home-scroll','home-refresh',()=>{ renderHome(); toast('已刷新'); });
  bindPullRefresh('plans-scroll','plans-refresh',()=>{ renderPlans(planFilter); toast('已刷新'); });

  /* ============ 自动备份 / 启动 ============ */
  setInterval(()=>backup.auto(), 60000);
  window.addEventListener('DOMContentLoaded',async()=>{
    theme.init();
    // 有本地会话先立即进入首页，避免刷新时闪现登录页
    if(db.currentUser&&db.users[db.currentUser]){ enterApp(); }
    else if(sb){ try{ const {data}=await sb.auth.getUser(); if(data.user){ await adoptUser(data.user,data.user.email); return; } }catch(e){} showAuth(); }
    else showAuth();
    // Supabase 会话异步后台验证：刷新已有本地会话时，拉取远程数据并刷新（不切换页面）
    if(sb&&db.currentUser){
      (async()=>{ try{ const {data}=await sb.auth.getUser(); if(data.user){ await adoptUser(data.user,data.user.email); } }catch(e){} })();
    }
    attachDetailSwipe();
    // URL 分享码自动唤起加入
    const h=location.hash.match(/join=([^&]+)/);
    if(h){ const code=h[1].toUpperCase(); (async()=>{ let p=Object.values(db.plans).find(x=>x.shareCode===code&&Date.now()<x.shareExpiry); if(!p)p=await share.pullShared(code); if(p){ if(db.currentUser){ if(!p.members||!Array.isArray(p.members))p.members=[]; if(!p.members.includes(db.currentUser))p.members.push(db.currentUser); store.setPlan(p); router.go('detail',{planId:p.id}); } else { toast('请先登录后加入协作'); } } })(); }
  });
  </script>
</body>
